name: Trivy Scan

on:
  schedule:
    - cron: 0 10 1 * *  # Every month at 10:00 AM UTC (on the 1st)
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  TRIVY_VERSION: "0.74.0"

jobs:
  setup:
    name: Fetch Images from GitHub Container Registry
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.fetch_images.outputs.images }}
    steps:
      - name: Install Dependencies
        run: sudo apt-get update && sudo apt-get install -y wget jq zip

      - name: Authenticate with GitHub Container Registry
        env:
          CR_PAT: ${{ secrets.TOKEN }}
        run: echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Fetch Images with Stable and ARM Tags
        id: fetch_images
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          echo "Fetching images with stable and arm tags from GitHub Container Registry.."
          # Hardcoded images for Trivy scan
          SELECTED_IMAGES=(
            "ghcr.io/rajanagori/nightingale:stable"
            "ghcr.io/rajanagori/nightingale:arm64"
            "ghcr.io/rajanagori/nightingale_frontend_community:arm64"
            "ghcr.io/rajanagori/nightingale_frontend_community:amd64"
            "ghcr.io/rajanagori/nightingale_backend_community:arm64"
            "ghcr.io/rajanagori/nightingale_backend_community:amd64"
          )

          echo "Used images: ${SELECTED_IMAGES[@]}"

          echo "images=$(jq -c -n '$ARGS.positional' --args "${SELECTED_IMAGES[@]}")" >> "$GITHUB_OUTPUT"

  prepare_db:
    name: Warm Trivy databases
    runs-on: ubuntu-latest
    steps:
      - name: Install Trivy
        run: |
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i "trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          rm "trivy_${TRIVY_VERSION}_Linux-64bit.deb"

      # Shared by every matrix cell. Pre-downloading the Java DB avoids the
      # PROTOCOL_ERROR Trivy hits when it fetches javadb mid-scan.
      - name: Cache Trivy DBs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: ${{ runner.os }}-trivy-dbs-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-dbs-${{ env.TRIVY_VERSION }}-

      - name: Download vulnerability and Java DBs
        run: |
          trivy image --download-db-only --skip-version-check
          trivy image --download-java-db-only --skip-version-check

  scan:
    name: Run Trivy Scan and Generate SBOM
    needs: [setup, prepare_db]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.setup.outputs.images) }}
    steps:
      - name: Install Trivy
        run: |
          wget -q "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          sudo dpkg -i "trivy_${TRIVY_VERSION}_Linux-64bit.deb"
          rm "trivy_${TRIVY_VERSION}_Linux-64bit.deb"

      - name: Cache Trivy DBs
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/trivy/db
            ~/.cache/trivy/java-db
          key: ${{ runner.os }}-trivy-dbs-${{ env.TRIVY_VERSION }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-trivy-dbs-${{ env.TRIVY_VERSION }}-

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR and pull image
        env:
          CR_PAT: ${{ secrets.TOKEN }}
        run: |
          echo "$CR_PAT" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          if [[ "${{ matrix.image }}" == *":arm64" ]]; then
            docker pull --platform linux/arm64 "${{ matrix.image }}"
          else
            docker pull "${{ matrix.image }}"
          fi

      - name: Run Trivy Vulnerability Scanner
        run: |
          set -euo pipefail
          IMAGE="${{ matrix.image }}"
          IMAGE_NAME=$(echo "$IMAGE" | sed 's/[^a-zA-Z0-9]/_/g')
          mkdir -p artifacts

          ARGS=(--image-src docker --scanners vuln --severity CRITICAL,HIGH --timeout 60m --skip-version-check)
          if [[ "$IMAGE" == *":arm64" ]]; then
            ARGS+=(--platform linux/arm64)
          fi

          echo "Scanning $IMAGE with args: ${ARGS[*]}"

          # PROTOCOL_ERROR on a layer stream is usually a one-shot registry flake.
          run_trivy() {
            local format="$1"
            local output="$2"
            local attempt=1
            local max=2
            until trivy image "${ARGS[@]}" --format "$format" --output "$output" "$IMAGE"; do
              if (( attempt >= max )); then
                echo "Trivy $format scan failed after ${max} attempts."
                return 1
              fi
              echo "Trivy $format scan failed (attempt ${attempt}/${max}); retrying in 15s..."
              attempt=$((attempt + 1))
              sleep 15
            done
          }

          run_trivy sarif "artifacts/trivy-results-${IMAGE_NAME}.sarif"
          run_trivy cyclonedx "artifacts/sbom-${IMAGE_NAME}.cyclonedx.json"
          # Native Trivy JSON: PkgName / InstalledVersion / FixedVersion / Class / Type.
          # Consumed by Auto-Remediate for version bumps and PRs.
          run_trivy json "artifacts/vulns-${IMAGE_NAME}.json"

          echo "Verifying files in artifacts directory..."
          ls -al artifacts/

          if [[ ! -f "artifacts/trivy-results-${IMAGE_NAME}.sarif" ]]; then
            echo "Error: SARIF file was not created."
            exit 1
          fi

          if [[ ! -f "artifacts/sbom-${IMAGE_NAME}.cyclonedx.json" ]]; then
            echo "Error: JSON SBOM file was not created."
            exit 1
          fi

          if [[ ! -f "artifacts/vulns-${IMAGE_NAME}.json" ]]; then
            echo "Error: Trivy JSON report was not created."
            exit 1
          fi

      - name: Set Image Name for Upload
        id: set_image_name
        run: echo "IMAGE_NAME=$(echo '${{ matrix.image }}' | sed 's/[^a-zA-Z0-9]/_/g')" >> "$GITHUB_ENV"

      - name: Upload SARIF file to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: artifacts/trivy-results-${{ env.IMAGE_NAME }}.sarif

      - name: Upload Scan Results to Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: trivy-scan-results-${{ env.IMAGE_NAME }}
          path: artifacts/

  notify_sbom_parser:
    name: Notify sbom-parser repo
    runs-on: ubuntu-latest
    needs: scan
    if: ${{ success() }}
    steps:
      - name: Trigger sbom-parser repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.TOKEN  }}
        run: |
          curl -i -s -X POST https://api.github.com/repos/${{ secrets.USERNAME }}/sbom-parser/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -d "{\"event_type\":\"nightingale-trivy-complete\",
                 \"client_payload\":{\"target_branch\":\"main\",
                                     \"trivy_run_id\":\"${{ github.run_id }}\"}}" | head -n 1

  notify_gui_auto_remediate:
    name: Notify Nightingale-GUI repo
    runs-on: ubuntu-latest
    needs: scan
    if: ${{ success() }}
    steps:
      - name: Trigger Nightingale-GUI repository_dispatch
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          # The GUI repo's auto-remediate.yml listens for this event and
          # cross-repo-downloads our vulns-*.json artifacts.
          curl -i -s -X POST https://api.github.com/repos/${{ secrets.USERNAME }}/Nightingale-GUI/dispatches \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -d "{\"event_type\":\"nightingale-trivy-complete\",
                 \"client_payload\":{\"target_branch\":\"main\",
                                     \"trivy_run_id\":\"${{ github.run_id }}\"}}" | head -n 1

  trigger_auto_remediate:
    name: Trigger Auto-Remediate workflow
    runs-on: ubuntu-latest
    needs: scan
    if: ${{ success() }}
    permissions:
      actions: write
    steps:
      - name: Dispatch auto-remediate workflow with this run's id
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run auto-remediate.yml \
            --ref ${{ github.ref_name }} \
            -f trivy_run_id=${{ github.run_id }} \
            --repo ${{ github.repository }}
