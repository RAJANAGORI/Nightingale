name: Docker Image ARM64

on:
  schedule:
    - cron: '0 23 * * 6' # Every Saturday at 11:00 PM UTC
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Select which build to run'
        required: true
        default: 'all'
        type: choice
        options:
        - all
        - programming
        - dependent
        - main

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  ACTIONS_RUNNER_DEBUG: true
  ACTIONS_STEP_DEBUG: true

jobs:
  build-programming:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'all' || inputs.build_type == 'programming')) }}
    outputs:
      commit_hash: ${{ github.sha }}
    steps:
    - uses: actions/checkout@v7

    - name: GHCR login and Buildx
      id: setup
      uses: ./.github/actions/docker-login-buildx
      with:
        token: ${{ secrets.TOKEN }}
        username: ${{ secrets.USERNAME }}

    - name: Build programming image
      uses: ./.github/actions/build-push-sign
      with:
        file: architecture/arm64/v8/Dockerfiles/programming_langauge.Dockerfile
        platforms: linux/arm64
        image-name: ${{ env.USERNAME || 'default-user' }}/nightingale_programming_image
        image-tag: arm64
        commit-hash: ${{ env.COMMIT_HASH }}
        driver: ${{ steps.setup.outputs.driver }}

  build-dependent:
    needs: build-programming
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      (
        needs.build-programming.result == 'success' ||
        needs.build-programming.result == 'skipped'
      ) &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'all' || inputs.build_type == 'dependent'))
      ) &&
      (
        needs.build-programming.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_type == 'dependent')
      )
    strategy:
      matrix:
        dockerfile:
          - name: nightingale_forensic_and_red_teaming
            file: forensics_and_redteam.Dockerfile
          - name: nightingale_mobile_vapt_image
            file: mobile_vapt.Dockerfile
          - name: nightingale_network_vapt_image
            file: network_vapt.Dockerfile
          - name: nightingale_osint_tools_image
            file: osint_tools.Dockerfile
          - name: nightingale_web_vapt_image
            file: web_vapt.Dockerfile
          - name: nightingale_wordlist_image
            file: wordlist.Dockerfile
    steps:
    - uses: actions/checkout@v7

    - name: GHCR login and Buildx
      id: setup
      uses: ./.github/actions/docker-login-buildx
      with:
        token: ${{ secrets.TOKEN }}
        username: ${{ secrets.USERNAME }}

    - name: Build dependent image
      uses: ./.github/actions/build-push-sign
      with:
        file: Dockerfiles/${{ matrix.dockerfile.file }}
        platforms: linux/arm64
        image-name: ${{ env.USERNAME }}/${{ matrix.dockerfile.name }}
        image-tag: arm64
        commit-hash: ${{ env.COMMIT_HASH }}
        driver: ${{ steps.setup.outputs.driver }}

  build-main:
    needs: build-dependent
    runs-on: ubuntu-latest
    if: |
      always() &&
      !cancelled() &&
      (
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.build_type == 'all' || inputs.build_type == 'main'))
      ) &&
      (
        needs.build-dependent.result == 'success' ||
        (github.event_name == 'workflow_dispatch' && inputs.build_type == 'main' && needs.build-dependent.result == 'skipped')
      )
    steps:
    - uses: actions/checkout@v7

    - name: GHCR login and Buildx
      id: setup
      uses: ./.github/actions/docker-login-buildx
      with:
        token: ${{ secrets.TOKEN }}
        username: ${{ secrets.USERNAME }}

    - name: Build final image
      id: push
      uses: ./.github/actions/build-push-sign
      with:
        file: Dockerfile
        platforms: linux/arm64
        image-name: ${{ env.USERNAME }}/nightingale
        image-tag: arm64
        commit-hash: ${{ env.COMMIT_HASH }}
        driver: ${{ steps.setup.outputs.driver }}
        arch: arm64
        extra-apt-packages: netcat-openbsd

    - name: Set up QEMU
      if: ${{ github.event_name == 'schedule' || inputs.build_type == 'all' }}
      uses: docker/setup-qemu-action@v3
      with:
        platforms: linux/arm64

    - name: Audit Go stdlib in final image
      if: ${{ github.event_name == 'schedule' || inputs.build_type == 'all' }}
      run: |
        set -eux
        IMAGE="${{ env.DOCKER_REGISTRY }}/${{ env.USERNAME }}/nightingale@${{ steps.push.outputs.digest }}"
        docker pull --platform linux/arm64 "${IMAGE}"
        docker run --rm --platform linux/arm64 \
          --entrypoint /bin/bash \
          "${IMAGE}" -c '/usr/local/bin/audit-go-binaries.sh --strict'
