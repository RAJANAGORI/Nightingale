name: Auto Remediate OSS CVEs

# Closes the loop on Trivy findings:
#   1. Triggered by Trivy Scan completing (or manually).
#   2. Downloads the vulns-*.json artifacts produced by trivy.yml.
#   3. Runs scripts/auto-remediate/remediate.py to:
#        - bump pip / npm pins in configuration/cve-mitigation/
#        - propose vuln-library-purge additions for allowlisted packages
#        - bump go-min-version.txt + ARG GO_VERSION when Go stdlib CVEs hit
#   4. Opens a PR with the patch (peter-evans/create-pull-request@v7).
#
# Policy: NEVER auto-merge. A human reviewer signs off. Docker Image CI and
# the next scheduled Trivy run validate the result.

on:
  workflow_dispatch:
    inputs:
      trivy_run_id:
        description: "Trivy Scan run id whose artifacts to consume (defaults to latest successful run on main)."
        required: false
        type: string
      dry_run:
        description: "Build the plan and write artifacts but do NOT patch files / open PR."
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

  schedule:
    # Run 30 minutes after the monthly Trivy cron to catch the latest scan.
    - cron: "30 10 1 * *"

permissions:
  contents: write
  pull-requests: write
  actions: read

concurrency:
  group: auto-remediate
  cancel-in-progress: false

jobs:
  remediate:
    name: Generate remediation PR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/auto-remediate/requirements.txt

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/auto-remediate/requirements.txt

      - name: Resolve Trivy run id
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.trivy_run_id }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_RUN_ID:-}" ]; then
            RUN_ID="${INPUT_RUN_ID}"
          else
            RUN_ID=$(gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow trivy.yml \
              --branch main \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
          fi
          if [ -z "${RUN_ID}" ] || [ "${RUN_ID}" = "null" ]; then
            echo "No successful Trivy run found." >&2
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "${GITHUB_OUTPUT}"

      - name: Download Trivy artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p trivy-artifacts
          gh run download "${{ steps.resolve.outputs.run_id }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir trivy-artifacts
          echo "=== Downloaded files ==="
          find trivy-artifacts -type f -name '*.json' | sort

      - name: Run remediation engine
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          DRY_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          python -m scripts.auto-remediate.remediate \
            --artifacts trivy-artifacts \
            --repo . \
            --output remediation-plan.json \
            --pr-body pr-body.md \
            --summary summary.md \
            --trivy-run-id "${{ steps.resolve.outputs.run_id }}" \
            ${DRY_FLAG}

      - name: Publish job summary
        if: always()
        run: |
          if [ -f summary.md ]; then
            cat summary.md >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload remediation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: auto-remediate-${{ steps.resolve.outputs.run_id }}
          path: |
            remediation-plan.json
            pr-body.md
            summary.md
          if-no-files-found: warn

      - name: Detect changes
        id: detect
        run: |
          set -euo pipefail
          if git diff --quiet -- configuration/ Dockerfile Dockerfiles/ architecture/; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open pull request
        if: ${{ steps.detect.outputs.changed == 'true' && inputs.dry_run != 'true' }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-remediate/trivy-${{ steps.resolve.outputs.run_id }}
          base: main
          commit-message: |
            fix(security): auto-remediate OSS CVEs from Trivy run ${{ steps.resolve.outputs.run_id }}

            Generated by .github/workflows/auto-remediate.yml.
          title: "fix(security): auto-remediate OSS CVEs from Trivy run ${{ steps.resolve.outputs.run_id }}"
          body-path: pr-body.md
          labels: |
            security
            auto-remediate
            dependencies
          delete-branch: true
          add-paths: |
            configuration/cve-mitigation/**
            Dockerfile
            Dockerfiles/**
            architecture/**
